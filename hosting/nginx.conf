# Raygun web hosting (static nginx, Portainer-ready)
#
# Two ways to serve the WASM build on your own server:
#
# A) Prebuilt image from the GitHub release (recommended):
#    1. In Portainer: Stacks > Add stack > Build method "Repository",
#       Repository URL: https://github.com/kao-offline/raygun
#       Compose path: hosting/docker-compose.yml
#       (or paste hosting/docker-compose.yml into the Web editor and set
#       RAYGUN_VERSION in Environment variables).
#    2. Deploy. The image downloads the release zip at build time, so no
#       files to upload. Serves on port 8080.
#
# B) Serve local files (no rebuild): unzip raygun-web-<ver>.zip from the
#    release into hosting/web/, then deploy hosting/docker-compose.local.yml
#    from that directory.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM mime (recent nginx already maps it; explicit is safer)
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    # File names don't change between versions: always revalidate,
    # or an upgrade can leave browsers with a stale module.
    location ~* \.(wasm|js|html)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # Serve precompressed siblings made by `cargo xtask web`
    gzip_static on;
    gunzip on;
}
